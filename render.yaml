services:
  - type: web
    name: signalharbor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MOLTBOOK_API_URL
        value: https://www.moltbook.com
      - key: MOLTBOOK_SUBMOLT
        value: lablab
      - key: SURGE_API_URL
        value: https://api.surge.xyz
      - key: PYTHON_VERSION
        value: "3.12"
